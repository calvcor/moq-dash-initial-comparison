# Un único punto de entrada HTTP (edge, puerto 80) más los puertos UDP de MoQ (4433) y WebRTC (8189). Un proxy inverso externo
# con HTTPS (p. ej. Nginx Proxy Manager) solo tiene que reenviar al puerto 80.
# Red de dos tramos: DASH y MoQ solo se alcanzan a través del router, que emula el enlace.
# La ingesta (orquestador -> nginx / relay) va por la red interna "core" y no se degrada.
#
# Variables opcionales (fichero .env): HTTP_PORT (80), MOQ_PORT (4433), PUBLIC_HOST (localhost), el nombre
# con el que el navegador accede, para el certificado autofirmado del relay, y MOQ_HOST, la dirección a la
# que el navegador debe conectar por MoQ cuando el nombre de la página apunta a un proxy y no a este servidor.
services:
  # Entrada HTTP única: reparte entre dashboard, API, LL-DASH y huella del certificado
  edge:
    image: nginx:alpine
    container_name: testbed-edge
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - core
    depends_on:
      - router
      - web
      - orchestrator
    restart: unless-stopped

  # 0. Router de emulación de red (tc + netem) entre el navegador y los servidores finales
  router:
    build: ./router
    container_name: testbed-router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - NGINX_IP=172.30.50.10
      - RELAY_IP=172.30.50.11
      - RTC_IP=172.30.50.12
    ports:
      - "${MOQ_PORT:-4433}:4433/udp"   # MoQ / QUIC -> moq-relay:4433 (el navegador va directo)
      - "8189:8189/udp"                # WebRTC (ICE, DTLS, SRTP) -> mediamtx:8189 (el navegador va directo)
    networks:
      default:
      core:
        ipv4_address: 172.30.50.2
    restart: unless-stopped

  # 1. MoQ Relay Oficial (Docker Hub moqdev/moq-relay)
  moq-relay:
    image: moqdev/moq-relay:latest
    container_name: testbed-moq-relay
    command: >
      --listen 0.0.0.0:4433
      --listen-tls-generate ${PUBLIC_HOST:-localhost}
      --web-http-listen 0.0.0.0:8081
      --auth-public anon/**
    networks:
      core:
        ipv4_address: 172.30.50.11
    restart: unless-stopped

  # Servidor WebRTC: recibe por RTSP la calidad más alta, sin recodificar, y la sirve por WHEP
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: testbed-mediamtx
    environment:
      # Dirección que se anuncia al navegador en los candidatos ICE: debe ser la de este servidor tal como
      # la alcanza el navegador (la misma que MOQ_HOST detrás de un proxy; 127.0.0.1 en local)
      - MTX_WEBRTCADDITIONALHOSTS=${MOQ_HOST:-127.0.0.1}
      - MTX_WEBRTCLOCALUDPADDRESS=:8189
      - MTX_WEBRTCIPSFROMINTERFACES=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
    networks:
      core:
        ipv4_address: 172.30.50.12
    restart: unless-stopped

  # 2. Servidor Nginx para entrega HTTP de LL-DASH: reenvía sin búfer al origen chunked del orquestador
  nginx-dash:
    image: nginx:alpine
    container_name: testbed-nginx-dash
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      core:
        ipv4_address: 172.30.50.10
    restart: unless-stopped

  # 3. Orquestador FastAPI + FFmpeg (Codificación de BBB y publicación dual)
  orchestrator:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: testbed-orchestrator
    init: true  # recoge los procesos FFmpeg huérfanos al reiniciar pipelines
    environment:
      - MOQ_RELAY_URL=https://moq-relay:4433/anon
      - ROUTER_URL=http://172.30.50.2:9000
      - MOQ_PORT=${MOQ_PORT:-4433}
      - MOQ_HOST=${MOQ_HOST:-}
      - RTC_PUBLISH_URL=rtsp://172.30.50.12:8554/live
    networks:
      - default
      - core
    volumes:
      - ./media:/data  # vídeo fuente; si falta, el orquestador lo descarga aquí al arrancar
      - ./server/app:/app/app
    depends_on:
      - moq-relay
      - nginx-dash
      - mediamtx
      - router
    restart: unless-stopped

  # 4. Dashboard Web (React + TypeScript + Chart.js en puerto 5173)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: testbed-web
    depends_on:
      - orchestrator
    restart: unless-stopped

networks:
  core:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          # Las direcciones automáticas salen de la mitad alta, para que nunca ocupen las fijas de arriba
          ip_range: 172.30.50.128/25
