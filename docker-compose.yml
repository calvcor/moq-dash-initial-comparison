# Red de dos tramos: el navegador solo llega a DASH y a MoQ a través del router, que emula el enlace.
# La ingesta (orquestador -> nginx / relay) va por la red interna "core" y no se degrada.
services:
  # 0. Router de emulación de red (tc + netem) entre el navegador y los servidores finales
  router:
    build: ./router
    container_name: testbed-router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - NGINX_IP=172.30.50.10
      - RELAY_IP=172.30.50.11
    ports:
      - "8080:8080"       # LL-DASH -> nginx-dash:80
      - "4433:4433/udp"   # MoQ / QUIC -> moq-relay:4433
      - "8081:8081"       # huella del certificado del relay
    networks:
      default:
      core:
        ipv4_address: 172.30.50.2
    restart: unless-stopped

  # 1. MoQ Relay Oficial (Docker Hub moqdev/moq-relay)
  moq-relay:
    image: moqdev/moq-relay:latest
    container_name: testbed-moq-relay
    command: >
      --listen 0.0.0.0:4433
      --listen-tls-generate localhost
      --web-http-listen 0.0.0.0:8081
      --auth-public anon/**
    networks:
      core:
        ipv4_address: 172.30.50.11
    restart: unless-stopped

  # 2. Servidor Nginx para entrega HTTP de LL-DASH: reenvía sin búfer al origen chunked del orquestador
  nginx-dash:
    image: nginx:alpine
    container_name: testbed-nginx-dash
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      core:
        ipv4_address: 172.30.50.10
    restart: unless-stopped

  # 3. Orquestador FastAPI + FFmpeg (Codificación de BBB y publicación dual)
  orchestrator:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: testbed-orchestrator
    init: true  # recoge los procesos FFmpeg huérfanos al reiniciar pipelines
    environment:
      - MOQ_RELAY_URL=https://moq-relay:4433/anon
      - ROUTER_URL=http://172.30.50.2:9000
    networks:
      - default
      - core
    ports:
      - "8000:8000"
    volumes:
      - ./media:/data  # vídeo fuente; si falta, el orquestador lo descarga aquí al arrancar
      - ./server/app:/app/app
    depends_on:
      - moq-relay
      - nginx-dash
      - router
    restart: unless-stopped

  # 4. Dashboard Web (React + TypeScript + Chart.js en puerto 5173)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: testbed-web
    ports:
      - "5173:80"
    depends_on:
      - orchestrator
    restart: unless-stopped

networks:
  core:
    ipam:
      config:
        - subnet: 172.30.50.0/24
          # Las direcciones automáticas salen de la mitad alta, para que nunca ocupen las fijas de arriba
          ip_range: 172.30.50.128/25
