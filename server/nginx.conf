events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    types {
        application/dash+xml mpd;
        video/mp4 mp4 m4s;
        audio/mp4 m4a;
    }

    server {
        listen 80;
        server_name localhost;
        root /var/www;

        location = /time {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Content-Type text/plain;
            return 200 "$time_iso8601";
        }

        # El origen LL-DASH vive en el orquestador: se reenvía sin búfer para no retener los fragmentos CMAF.
        # Las cabeceras CORS las pone el origen.
        location /media/dash/ {
            resolver 127.0.0.11 valid=10s;
            set $origin http://orchestrator:8000;
            proxy_pass $origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            # Permite al dashboard leer el tamaño transferido de cada petición (Resource Timing API)
            add_header Timing-Allow-Origin "*" always;
        }

        location / {
            return 200 "Nginx DASH server running in Docker container\n";
            add_header Content-Type text/plain;
        }
    }
}
