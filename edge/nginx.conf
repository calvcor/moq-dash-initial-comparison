# Punto de entrada único del testbed (puerto 80). Todo lo que pide el navegador por HTTP pasa por aquí
# y se reparte internamente; un proxy inverso externo con HTTPS solo tiene que reenviar a este puerto.
# MoQ no pasa por aquí: es QUIC sobre UDP y el navegador va directo al puerto del relay.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nodelay   on;

    # DNS interno de Docker: los servicios se resuelven en cada petición, no solo al arrancar
    resolver 127.0.0.11 valid=10s;

    # LL-DASH entra por el router de emulación de red (IP fija en la red interna). Conexiones
    # persistentes: abrir una conexión TCP nueva por segmento cambiaría lo que se quiere medir.
    upstream dash_via_router {
        server 172.30.50.2:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # API de control y de medida del orquestador
        location ~ ^/(api/|docs|openapi\.json) {
            set $orchestrator http://orchestrator:8000;
            proxy_pass $orchestrator;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # Manifiesto y segmentos CMAF, sin búfer para no retener los fragmentos de baja latencia
        location /media/dash/ {
            proxy_pass http://dash_via_router;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }

        # Huella del certificado autofirmado del relay MoQ, para fijarlo en WebTransport
        location = /certificate.sha256 {
            proxy_pass http://172.30.50.11:8081;
        }

        # Señalización WebRTC (WHEP) de MediaMTX; el vídeo va después directo por UDP
        location /rtc/ {
            proxy_pass http://172.30.50.12:8889/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # Dashboard
        location / {
            set $web http://web:80;
            proxy_pass $web;
            proxy_set_header Host $http_host;
        }
    }
}
